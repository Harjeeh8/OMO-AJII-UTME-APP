<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTME Practice App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a5276;
            margin: 15px 0 5px;
            font-size: 1.6rem;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #2874a6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover, .btn:active { background: #1a5276; }
        .btn.secondary { background: #5d6d7e; }
        .btn.correct { background: #27ae60; }
        .btn.wrong { background: #e74c3c; }
        .question-box {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .timer, .score {
            text-align: center;
            font-size: 1.1rem;
            margin: 10px 0;
            font-weight: bold;
        }
        .options button {
            text-align: left;
            background: #ecf0f1;
            color: #333;
            margin: 8px 0;
        }
        .result {
            text-align: center;
            font-size: 1.3rem;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="home" class="screen active">
        <h1>UTME Practice App</h1>
        <p class="subtitle">Free practice for Nigerian students</p>
        <button class="btn" onclick="startSubject('English')">English</button>
        <button class="btn" onclick="startSubject('Mathematics')">Mathematics</button>
        <button class="btn" onclick="startSubject('Physics')">Physics</button>
        <button class="btn" onclick="startSubject('Chemistry')">Chemistry</button>
        <button class="btn" onclick="startSubject('Biology')">Biology</button>
        <button class="btn" onclick="startSubject('Government')">Government</button>
        <button class="btn" onclick="startSubject('Economics')">Economics</button>
        <button class="btn" onclick="startSubject('Literature')">Literature</button>
    </div><div id="quiz" class="screen">
        <div class="timer" id="timer">Time: 60s</div>
        <div class="score" id="score">Score: 0</div>
        <div class="question-box">
            <p id="questionText">Question will appear here</p>
        </div>
        <div class="options" id="options"></div>
        <button class="btn secondary" onclick="goHome()">Back to Subjects</button>
    </div>

    <div id="result" class="screen">
        <h1>Quiz Finished!</h1>
        <div class="result" id="finalScore"></div>
        <button class="btn" onclick="goHome()">Back to Subjects</button>
    </div>

    <script>

            Mathematics: [

                { q: "pH of a neutral solution is:", options: ["0", "7", "14", "1"], answer: 1 }

                { q: "Which is a direct tax?", options: ["VAT", "Import duty", "Income tax", "Excise duty"], answer: 2 }
            ],
            Literature: [
                { q: "Who wrote 'Things Fall Apart'?", options: ["Wole Soyinka", "Chinua Achebe", "Ngugi wa Thiong'o", "Ayi Kwei Armah"], answer: 1 },
                { q: "A poem with 14 lines is called a:", options: ["Limerick", "Sonnet", "Haiku", "Epic"], answer: 1 },
                { q: "The main character in a story is the:", options: ["Antagonist", "Protagonist", "Narrator", "Foil"], answer: 1 }
            ]
        };

        let currentSubject = "";
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;

        function startSubject(subject) {
            currentSubject = subject;
            currentQuestions = questions[subject];
            currentIndex = 0;
            score = 0;
            timeLeft = 60;
            document.getElementById("score").textContent = "Score: 0";
            showScreen("quiz");
            showQuestion();
            startTimer();
        }

        function showQuestion() {
            if (currentIndex >= currentQuestions.length) {
                endQuiz();
